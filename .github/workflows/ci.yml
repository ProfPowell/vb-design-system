# CI quality gate. GitHub Pages deploys straight from the committed docs/
# folder (deploy-from-branch), and npm publishes are run by hand — this
# workflow deploys nothing, it only decides whether main is healthy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build dist (esbuild)
        run: npm run build

      # dist/ is committed and is what the docs site + CDN consumers load.
      # A diff here means someone changed src/ without `npm run build`.
      - name: dist/ is current
        run: git diff --exit-code --stat -- dist

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Component tests run against the committed docs/ output (tests/serve-docs.mjs).
      - name: Component tests
        run: npm run test:components

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docs-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      # copy-assets + cook build; catches broken includes, missing vendor
      # files, and api.json manifests that no longer parse.
      - name: Build docs site
        run: npm run build
        working-directory: site
